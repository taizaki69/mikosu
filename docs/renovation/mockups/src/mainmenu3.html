<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mikosu main menu mockup, round 3</title>
<link rel="stylesheet" href="round3.css">
</head>
<body>
<div class="bg"></div>
<div class="mm-dim"></div>
<div class="flash l"></div>
<div class="flash r"></div>
<canvas class="viz" id="viz" width="1920" height="1080"></canvas>
<div class="logo" id="logo" style="left:340px;top:320px;width:440px;height:440px"></div>

<section class="uc sh wedge" id="user"></section>
<section class="np sh wedge flip" id="np"></section>
<nav class="mm-buttons" id="buttons"></nav>
<div class="mm-foot"><span>mikosu 0.1 &middot; based on neomod and McOsu</span><span>7,514 maps &middot; 13 skins</span></div>
<div class="tip sh"><div class="un"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>F2 in song select picks a random map &middot; Shift+F2 goes back</div></div>

<script src="icons.js"></script>
<script src="round3.js"></script>
<script>
const v = new URLSearchParams(location.search).get("v") || "lazer";
document.body.classList.add("v-" + v);
const CX = 560, CY = 540, R = 222;

document.getElementById("logo").innerHTML = flatLogo("m", "mikosu");
document.querySelector("#logo svg").style.color = "var(--hl)";
document.querySelector("#logo .word").style.cssText = "font-size:74px;color:#fff";

document.getElementById("user").innerHTML = `<div class="un"><div class="av">T</div><div>
  <b>taizaki</b><small>#48,213 global &middot; 4,218pp &middot; 97.84%</small>
  <div class="lvrow"><span class="lv">92</span><div class="lvl"><i></i></div></div></div></div>`;

const cb = (ic, on) => `<div class="cb sh${on ? " on" : ""}"><div class="un">${icon(ic)}</div></div>`;
document.getElementById("np").innerHTML = `<div class="un">
  <div class="song">${icon("music")}Lanternfall<small>Aurora Drift</small></div>
  <div class="ctl">${cb("prev")}${cb("pause", 1)}${cb("next")}${cb("info")}
    <div class="prog"><div class="t"><span>1:24</span><span>3:42</span></div><div class="b"><i></i></div></div></div></div>`;

// stable's buttons beside the logo, in lazer's button colours (play purple, browse lime, options grey, exit pink)
const btn = (cls, ic, label, key, colour, seed) => `<div class="mb sh ${cls}" style="--bc:${colour}">
  ${triangles(seed, 640, 100, { colour: "#fff", opacity: 0.16, size: 90, stroke: 1.6, count: 14 })}<div class="shine"></div>
  <div class="un"><span class="ic">${icon(ic)}</span>${label}<span class="kbd">${key}</span></div></div>`;
document.getElementById("buttons").innerHTML =
  btn("hover", "play", "Play", "P", "#6644cc", 3) + btn("", "download", "Browse maps", "B", "#a5cc00", 4) +
  btn("", "options", "Options", "O", "#555555", 5) + btn("", "exit", "Exit", "Q", "#ee3399", 6);

// lazer-style visualiser: 200 touching bars around the logo, the same spectrum drawn 5 times, rotated, faint white
const c = document.getElementById("viz"), x = c.getContext("2d"), r = rng(11);
const N = 200, ROUNDS = 5, LEN = 170;
const amp = [];
let s = 0;
for (let i = 0; i < N; i++) {
  s = s * 0.6 + r() * 0.4;
  const lows = 1 - i / N;
  amp.push(Math.min(0.8, Math.max(0.03, s * s * (0.35 + 0.65 * lows) * (r() < 0.06 ? 1.4 : 1))));
}
const w = 2 * R * Math.sin(Math.PI / N);
x.fillStyle = "rgba(255,255,255,0.13)";
for (let j = 0; j < ROUNDS; j++) {
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + (j * Math.PI * 2) / ROUNDS - Math.PI / 2;
    x.save();
    x.translate(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
    x.rotate(a);
    x.fillRect(0, -w / 2, LEN * amp[i], w);
    x.restore();
  }
}
</script>
</body>
</html>

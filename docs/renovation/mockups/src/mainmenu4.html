<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mikosu main menu mockup, round 4</title>
<link rel="stylesheet" href="round4.css">
</head>
<body>
<div class="bg"></div>
<div class="dim"></div>
<div class="mm-shade"></div>
<canvas class="viz" id="viz" width="1920" height="1080"></canvas>

<nav class="mm-buttons" id="buttons"></nav>
<div class="logo" id="logo" style="left:280px;top:300px;width:480px;height:480px"></div>

<section class="card glass ucard" id="user"></section>
<section class="card glass npcard" id="np"></section>
<div class="mm-foot"><span>mikosu 0.1 &middot; based on neomod and McOsu</span><span>7,514 maps &middot; 13 skins</span></div>
<div class="tip glass card" id="tip"></div>

<script src="icons.js"></script>
<script src="round4.js"></script>
<script>
const v = new URLSearchParams(location.search).get("v") || "stable";
document.body.classList.add("v-" + v);
// the menu shows the background brighter than song select does
document.querySelector(".dim").style.opacity = { stable: 0.35, moon: 0.8, day: 1 }[v];

document.getElementById("logo").innerHTML = orb(v, "m", "mikosu");
visualiser(document.getElementById("viz"), 520, 540, 236,
  { stable: "rgba(255,255,255,0.5)", moon: "rgba(190,230,255,0.45)", day: "rgba(255,150,205,0.5)" }[v], 5);

document.getElementById("user").innerHTML = `<div class="av">T</div><div>
  <b>taizaki</b><small>4,218pp &middot; #48,213 global &middot; 97.84%</small>
  <div class="lvr">Lv 92<div class="lv"><i></i></div></div></div>`;
const cb = (ic, on) => `<span class="cb${on ? " on" : ""}">${icon(ic)}</span>`;
document.getElementById("np").innerHTML = `<div class="song">${icon("music")}Lanternfall<small>Aurora Drift</small></div>
  <div class="ctl">${cb("prev")}${cb("pause", 1)}${cb("stop")}${cb("next")}${cb("info")}
    <div class="prog">1:24<div class="bar"><i></i></div>3:42</div></div>`;
document.getElementById("tip").innerHTML = `${icon("info")}F2 in song select picks a random map &middot; Shift+F2 goes back`;

// stable's four buttons, sliding out from behind the logo; the first one is hovered
const looks = {
  stable: [["linear-gradient(90deg, rgba(255,92,165,.94), rgba(190,110,255,.72))", "#ff6fb4"],
           ["linear-gradient(90deg, rgba(64,150,255,.92), rgba(90,200,255,.66))", "#4fb4ff"],
           ["linear-gradient(90deg, rgba(110,122,170,.86), rgba(150,160,205,.6))", "#a0a8d0"],
           ["linear-gradient(90deg, rgba(255,104,120,.92), rgba(255,160,120,.66))", "#ff7a86"]],
  moon: [["linear-gradient(90deg, rgba(18,28,56,.82), rgba(18,28,56,.55))", "#ff8fc4"],
         ["linear-gradient(90deg, rgba(18,28,56,.82), rgba(18,28,56,.55))", "#7fd0ff"],
         ["linear-gradient(90deg, rgba(18,28,56,.82), rgba(18,28,56,.55))", "#c9d4f0"],
         ["linear-gradient(90deg, rgba(18,28,56,.82), rgba(18,28,56,.55))", "#ffa08a"]],
  day: [["linear-gradient(90deg, rgba(255,200,228,.95), rgba(255,255,255,.72))", "#ff7cbc"],
        ["linear-gradient(90deg, rgba(190,226,255,.95), rgba(255,255,255,.72))", "#4cb8f5"],
        ["linear-gradient(90deg, rgba(226,230,245,.95), rgba(255,255,255,.72))", "#9aa6c8"],
        ["linear-gradient(90deg, rgba(255,214,206,.95), rgba(255,255,255,.72))", "#ff8a7a"]],
}[v];
const btns = [["play", "Play", "Solo and multiplayer", "P"], ["download", "Browse maps", "From the mirrors, read-only", "B"],
              ["options", "Options", "Graphics, skins, keys", "O"], ["exit", "Exit", "See you next session", "Q"]];
document.getElementById("buttons").innerHTML = btns.map(([ic, label, sub, key], i) => `
  <div class="mb glass${i === 0 ? " hov" : ""}" style="--layer:${looks[i][0]};--g:${looks[i][1]};--acc:${looks[i][1]}">
    <div class="sheen"></div><span class="ic" style="${v === "stable" ? "" : `color:${looks[i][1]}`}">${icon(ic)}</span>
    <span class="lbl"><b>${label}</b><small>${sub}</small></span><span class="k">${key}</span></div>`).join("");
</script>
</body>
</html>

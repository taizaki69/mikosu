<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mikosu main menu mockup</title>
<link rel="stylesheet" href="mockup.css">
<style>
  .only-bold { display: none !important; }
  .v-bold .only-bold { display: block !important; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="dim"></div>
<div class="glow-wash only-bold"></div>

<canvas class="viz" id="viz" width="1920" height="1080" style="left:0;top:0;width:1920px;height:1080px"></canvas>
<div class="logo" id="logo" style="left:330px;top:310px;width:460px;height:460px"></div>

<section class="mm-user glass" id="user"></section>
<section class="np" id="np"></section>
<nav class="mm-buttons" id="buttons"></nav>
<div class="mm-foot" id="foot"></div>
<div class="mm-tip" id="tip"></div>

<script src="icons.js"></script>
<script>
const v = variant();
const CX = 560, CY = 540;

document.getElementById("logo").innerHTML = logoSVG(v, "m") +
  `<div class="word" style="font-size:${v === "bold" ? 88 : 80}px">mikosu</div>`;

document.getElementById("user").innerHTML = `<div class="avatar">T</div><div><b>taizaki</b>
  <small>4,218pp &middot; #48,213 global</small><small>97.84% accuracy &middot; Lv 92</small><div class="lvl"><i></i></div></div>`;

document.getElementById("np").innerHTML = `
  <div class="song">${icon("note")} Aurora Drift &ndash; Lanternfall</div>
  <div class="controls"><span class="glass">${icon("prev")}</span><span class="glass">${icon("pause")}</span><span class="glass">${icon("next")}</span><span class="glass">${icon("info")}</span></div>
  <div class="bar"><i></i></div>`;

const btn = (cls, ic, label, hint) => `<div class="mm-btn ${cls} glass"><span class="ic">${icon(ic)}</span>${label}<small>${hint}</small></div>`;
document.getElementById("buttons").innerHTML =
  btn("play", "play", "Play", "P") + btn("browse", "browse", "Browse maps", "B") +
  btn("options", "options", "Options", "O") + btn("exit", "exit", "Exit", "Q");

document.getElementById("foot").innerHTML = `<span>mikosu 0.1 &middot; based on neomod and McOsu</span><span>7,514 beatmaps &middot; 13 skins</span>`;
document.getElementById("tip").innerHTML = v === "faithful" ? "" : "Tip: F2 in song select picks a random map, Shift+F2 goes back to the previous one.";

// visualizer around the logo: spectrum bars from deterministic noise, shaped like a real FFT (more energy low)
const c = document.getElementById("viz"), x = c.getContext("2d"), r = rng(7);
const N = v === "faithful" ? 128 : v === "refined" ? 150 : 180;
const R0 = 238;
const mags = [];
let smooth = 0;
for (let i = 0; i < N; i++) {
  const f = i / N;
  const base = 0.35 + 0.65 * Math.pow(1 - Math.abs(Math.sin(f * Math.PI * 3)), 2);
  smooth = smooth * 0.55 + r() * 0.45;
  mags.push(Math.max(0.05, base * smooth));
}
if (v === "bold") {
  // light rays behind everything
  x.save(); x.translate(CX, CY);
  for (let i = 0; i < 18; i++) {
    x.rotate((Math.PI * 2) / 18);
    const g = x.createLinearGradient(0, 0, 900, 0);
    g.addColorStop(0, "rgba(255,79,139,.20)"); g.addColorStop(1, "rgba(255,79,139,0)");
    x.fillStyle = g; x.beginPath(); x.moveTo(0, 0); x.lineTo(900, -55); x.lineTo(900, 55); x.closePath(); x.fill();
  }
  x.restore();
}
for (let i = 0; i < N; i++) {
  const a = (i / N) * Math.PI * 2 - Math.PI / 2;
  const len = (v === "faithful" ? 120 : v === "refined" ? 135 : 175) * mags[i];
  const x0 = CX + Math.cos(a) * R0, y0 = CY + Math.sin(a) * R0;
  const x1 = CX + Math.cos(a) * (R0 + len), y1 = CY + Math.sin(a) * (R0 + len);
  x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1);
  if (v === "faithful") {
    x.strokeStyle = "rgba(255,255,255,.55)"; x.lineWidth = 7; x.lineCap = "butt";
  } else if (v === "refined") {
    const g = x.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, "rgba(255,179,107,.9)"); g.addColorStop(1, "rgba(255,111,155,.15)");
    x.strokeStyle = g; x.lineWidth = 6; x.lineCap = "round"; x.shadowColor = "rgba(255,127,158,.6)"; x.shadowBlur = 12;
  } else {
    const g = x.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, i % 2 ? "rgba(51,214,255,1)" : "rgba(255,79,139,1)"); g.addColorStop(1, "rgba(255,255,255,.1)");
    x.strokeStyle = g; x.lineWidth = 6; x.lineCap = "round"; x.shadowColor = i % 2 ? "#33d6ff" : "#ff4f8b"; x.shadowBlur = 18;
  }
  x.stroke();
}
x.shadowBlur = 0;
if (v === "bold") {
  // beat ring + particles
  x.beginPath(); x.arc(CX, CY, R0 + 205, 0, Math.PI * 2);
  x.strokeStyle = "rgba(255,255,255,.18)"; x.lineWidth = 3; x.stroke();
  const p = rng(99);
  for (let i = 0; i < 90; i++) {
    const a = p() * Math.PI * 2, d = R0 + 60 + p() * 360, s = 1 + p() * 4;
    x.fillStyle = p() > 0.5 ? "rgba(255,255,255,.8)" : "rgba(255,176,46,.8)";
    x.beginPath(); x.arc(CX + Math.cos(a) * d, CY + Math.sin(a) * d, s, 0, Math.PI * 2); x.fill();
  }
}
if (v === "refined") {
  // soft halo under the logo
  const g = x.createRadialGradient(CX, CY, 150, CX, CY, 330);
  g.addColorStop(0, "rgba(255,127,158,.0)"); g.addColorStop(0.7, "rgba(255,127,158,.18)"); g.addColorStop(1, "rgba(255,127,158,0)");
  x.fillStyle = g; x.beginPath(); x.arc(CX, CY, 330, 0, Math.PI * 2); x.fill();
}
</script>
</body>
</html>
